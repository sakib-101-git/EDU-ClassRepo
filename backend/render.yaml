services:
  - type: web
    name: edu-classrepo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        sync: false            # your-service.onrender.com
      - key: DATABASE_URL
        sync: false            # Supabase SESSION POOLER url (IPv4-compatible)
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # https://your-frontend.vercel.app
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: ADMIN_EMAIL_1
        sync: false
      - key: ADMIN_NAME_1
        sync: false
